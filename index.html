// 처방 입력칸 키보드 이동: Tab은 브라우저 기본 동작으로 다음 칸으로 넘어가고,
// ← (왼쪽 화살표)를 누르면 이전 칸으로 돌아간다. 텍스트/숫자 입력칸은 커서가 맨 앞(0번 위치)에
// 있을 때만 이전 칸으로 이동한다(그래야 입력하던 글자 중간에서 왼쪽으로 커서를 옮기는 일반적인
// 동작을 방해하지 않는다). number 타입 등 커서 위치를 지원하지 않는 입력칸과 select(드롭다운)는
// 항상 이전 칸으로 이동한다. 이전 칸으로 이동한 뒤에는 그 칸의 기존 값을 전체 선택해두어,
// 지우는 과정 없이 바로 숫자를 입력하면 기존 값이 즉시 새 값으로 바뀐다.
const RX_FIELD_ORDER = ['drug','dose','freq','dur','timing','note'];
function rxFieldKeydown(e, idx, fieldName){
  if(e.key !== 'ArrowLeft') return;
  const el = e.target;
  // number 타입 입력칸(총 투약일)은 브라우저에 따라 selectionStart가 예외를 던지지 않고
  // null을 반환하는 경우가 있어(파이어폭스/일부 안드로이드 브라우저), 그럴 때 atStart가 false로
  // 잘못 계산되어 "총 투약일"에서 그 다음 칸(1일 횟수)으로 넘어가지 못하고 멈추는 문제가 있었다.
  // number 타입은 애초에 커서 위치 개념이 중요하지 않으므로 검사 자체를 하지 않고 항상 이동을 허용한다.
  if(el.tagName === 'INPUT' && el.type !== 'number'){
    let atStart = true;
    try{ atStart = (el.selectionStart === 0 && el.selectionEnd === 0); }
    catch(err){ atStart = true; } // 캐럿 위치를 알 수 없는 입력칸은 항상 이동 허용
    if(!atStart) return; // 글자 중간이면 커서만 왼쪽으로 이동(기본 동작 유지)
  }
  const pos = RX_FIELD_ORDER.indexOf(fieldName);
  if(pos <= 0) return; // 이미 첫 칸(약품명)이면 더 이동할 곳 없음
  e.preventDefault();
  const prevField = RX_FIELD_ORDER[pos-1];
  const prevEl = document.getElementById(`rx-${prevField}-${idx}`);
  if(!prevEl) return;
  prevEl.focus();
  if(prevEl.tagName === 'INPUT'){
    try{ prevEl.select(); }catch(err){}
  }
}

// 이미 다른 행(다른 과 포함)에 같은 약품명이 있으면 중복 처방 여부를 확인한다.
function checkDuplicateRxDrug(idx){
  const input = document.getElementById(`rx-drug-${idx}`);
  if(!input) return;
  const val = input.value.trim();
  if(!val) return;
  const tbody = document.getElementById('rx-table-body');
  if(!tbody) return;
  let dup = null;
  tbody.querySelectorAll('tr').forEach(tr=>{
    const otherIdx = tr.id.replace('rx-row-','');
    if(String(otherIdx) === String(idx)) return;
    let otherDrug, otherBy, otherDept;
    if(rxRowLockedItems[otherIdx]){
      otherDrug = rxRowLockedItems[otherIdx].drug;
      otherBy = rxRowLockedItems[otherIdx].by;
      otherDept = rxRowLockedItems[otherIdx].byDept;
    } else {
      otherDrug = document.getElementById(`rx-drug-${otherIdx}`)?.value.trim();
      const owner = rxRowPrescriberMap[otherIdx];
      otherBy = owner ? owner.by : '';
      otherDept = owner ? owner.byDept : '';
    }
    if(otherDrug && otherDrug.toLowerCase() === val.toLowerCase()){
      dup = {drug: otherDrug, by: otherBy, byDept: otherDept};
    }
  });
  if(dup){
    const who = dup.byDept ? `${dup.byDept}${dup.by?(' · '+dup.by):''}` : (dup.by || '다른 처방');
    const proceed = confirm(`⚠️ "${dup.drug}"은(는) 이미 ${who}에서 처방한 약품입니다.\n중복으로 처방하시겠습니까?`);
    if(!proceed){ input.value=''; input.focus(); }
  }
}

// "+ 약 추가" 버튼용: 이미 입력된 1번째(첫 줄) 약의 1일 횟수/총 투약일/투약 시기를 기본값으로 물려받아 새 줄을 추가.
// 약품명/용량/기타사항은 약마다 다르므로 비워두고, 필요하면 새 줄에서 개별로 값을 바꿀 수 있다.
function addRxRowWithDefaults(){
  const tbody = document.getElementById('rx-table-body');
  let defaults = {};
  if(tbody){
    const firstRow = tbody.querySelector('tr');
    if(firstRow){
      const idx = firstRow.id.replace('rx-row-','');
      defaults = {
        freq: document.getElementById(`rx-freq-${idx}`)?.value || '',
        duration: document.getElementById(`rx-dur-${idx}`)?.value || '',
        timing: document.getElementById(`rx-timing-${idx}`)?.value || ''
      };
    }
  }
  addRxRow(defaults);
}

function addRxRow(item, noFocus){
  const idx = rxRowCount++;
  const tbody = document.getElementById('rx-table-body');
  if(!tbody) return;
  if(item && item.by){
    rxRowPrescriberMap[idx] = {by: item.by, byDept: item.byDept||''};
  }
  const owner = rxRowPrescriberMap[idx];
  // 다른 과가 이미 처방한 약은, 지금 열려있는 과(activeDeptName)와 다르면 이 화면에서는 읽기전용으로 잠근다.
  // (관리자/선교사 계정은 필요시 수정할 수 있도록 예외)
  const locked = !!(owner && owner.byDept && activeDeptName && owner.byDept !== activeDeptName && !isAdminUser());
  if(locked) rxRowLockedItems[idx] = {...item, by: owner.by, byDept: owner.byDept};
  tbody.insertAdjacentHTML('beforeend', rxRowHTML(idx, item, locked, owner));
  if(!noFocus && !locked){
    const drugInput = document.getElementById(`rx-drug-${idx}`);
    if(drugInput) drugInput.focus();
  }
}

function removeRxRow(idx){
  const row = document.getElementById(`rx-row-${idx}`);
  if(row) row.remove();
}

function collectRxRows(){
  const rows = [];
  const tbody = document.getElementById('rx-table-body');
  if(!tbody) return rows;
  tbody.querySelectorAll('tr').forEach(tr=>{
    const idx = tr.id.replace('rx-row-','');
    if(rxRowLockedItems[idx]){
      rows.push(rxRowLockedItems[idx]); // 잠긴(다른 과) 처방행은 입력창이 없으므로 원본 데이터를 그대로 유지
      return;
    }
    const drug = document.getElementById(`rx-drug-${idx}`)?.value.trim();
    if(!drug) return;
    const carried = rxRowPrescriberMap[idx];
    rows.push({
      drug,
      dose: document.getElementById(`rx-dose-${idx}`)?.value.trim() || '',
      freq: document.getElementById(`rx-freq-${idx}`)?.value || '',
      duration: document.getElementById(`rx-dur-${idx}`)?.value || '',
      timing: document.getElementById(`rx-timing-${idx}`)?.value || '',
      note: document.getElementById(`rx-note-${idx}`)?.value.trim() || '',
      by: carried ? carried.by : (currentUser ? currentUser.name : ''),
      byDept: carried ? carried.byDept : (activeDeptName || (currentUser && currentUser.dept) || '')
    });
  });
  return rows;
}

// 이 진료과가 이번에 "새로" 추가한 약만 골라낸다 (다른 과가 이미 넣어둔 처방은 제외).
// 진료 기록(타임라인)에는 각 의사가 실제로 처방한 약만 나와야 하기 때문.
function collectNewRxRows(){
  const rows = [];
  const tbody = document.getElementById('rx-table-body');
  if(!tbody) return rows;
  tbody.querySelectorAll('tr').forEach(tr=>{
    const idx = parseInt(tr.id.replace('rx-row-',''), 10);
    if(rxRowCarriedFlags[idx]) return; // 이번 접수 세션을 열 때 이미 채워져 있던 행(이 과가 새로 추가한 게 아님)은 제외
    if(rxRowLockedItems[idx]) return; // 다른 과 처방(잠긴 행)은 입력창이 없고, 내가 새로 추가한 것도 아니므로 제외
    const drug = document.getElementById(`rx-drug-${idx}`)?.value.trim();
    if(!drug) return;
    rows.push({
      drug,
      dose: document.getElementById(`rx-dose-${idx}`)?.value.trim() || '',
      freq: document.getElementById(`rx-freq-${idx}`)?.value || '',
      duration: document.getElementById(`rx-dur-${idx}`)?.value || '',
      timing: document.getElementById(`rx-timing-${idx}`)?.value || '',
      note: document.getElementById(`rx-note-${idx}`)?.value.trim() || '',
      by: currentUser ? currentUser.name : '',
      byDept: activeDeptName || (currentUser && currentUser.dept) || ''
    });
  });
  return rows;
}

// 환자의 전체 진료 기록을 날짜 오름차순(오래된 것 → 최근 것)으로 쭉 이어서 보여주는 타임라인.
// 프로그레스 노트뿐 아니라 그날 실제로 작성된 진단명·검사결과·약처방(표 형식)까지 전부 보여주며,
// 과거력은 여기 포함하지 않는다(과거력은 별도 카드에 항상 표시됨). 다른 의사의 기록은 읽기 전용이다.
// 예약(appointments 컬렉션) 문서를 진료 기록 타임라인에 함께 끼워넣기 위한 "가짜 방문" 형태로 변환.
// date 필드는 실제 방문 기록과 마찬가지로 .toDate()를 지원하는 객체로 만들어 정렬·표시 로직을 그대로 재사용한다.
function apptSortDate(a){
  const iso = `${a.date||'1970-01-01'}T${a.time||'00:00'}:00`;
  const d = new Date(iso);
  return isNaN(d.getTime()) ? new Date(0) : d;
}
function apptToTimelineItem(a){
  const d = apptSortDate(a);
  return { id: 'appt-'+a.id, _appt: true, _apptData: a, date: { toDate: () => d } };
}

// 진료 기록(방문) 목록과 예약 목록을 하나의 타임라인으로 합쳐서 날짜순으로 정렬한다.
// activeVisitsCache 등 다른 곳에서 쓰는 순수 방문 배열은 건드리지 않고, 화면 표시용으로만 합친다.
function mergeVisitsWithAppointments(visits, appts){
  const apptItems = (appts||[]).map(apptToTimelineItem);
  return (visits||[]).concat(apptItems).sort((x,y)=>{
    const xm = x.date && x.date.toDate ? x.date.toDate().getTime() : 0;
    const ym = y.date && y.date.toDate ? y.date.toDate().getTime() : 0;
    return xm - ym;
  });
}

function apptTimelineEntryHTML(v){
  const a = v._apptData || {};
  const dateLabel = a.date ? `${a.date}${a.time?(' '+a.time):''}` : '-';
  const isPast = v.date && v.date.toDate && v.date.toDate().getTime() < Date.now();
  return `<div class="timeline-entry" id="timeline-${v.id}" style="background:var(--paper);">
    <div class="tdate">📅 ${dateLabel}${isPast?' · 지난 예약':' · 예약'}</div>
    <p style="margin:4px 0; font-size:14.5px;">${a.siteName?(a.siteName+' · '):''}${a.note?a.note:'(메모 없음)'}</p>
  </div>`;
}

function visitTimelineHTML(visits){
  if(!visits || visits.length===0) return '<div class="empty-note">이전 기록이 없습니다.</div>';
  const body = visits.map(v=>{
    if(v._appt) return apptTimelineEntryHTML(v);
    const attach = (v.photoURL || v.pdfURL) ? `<div class="attach-row">
        ${v.photoURL?`<a class="attach-chip" href="${v.photoURL}" target="_blank">📷 사진 보기</a>`:''}
        ${v.pdfURL?`<a class="attach-chip" href="${v.pdfURL}" target="_blank">📄 PDF 보기</a>`:''}
      </div>` : '';
    // 그날 기록된 혈압/체중/공복혈당은 (만성질환 여부와 무관하게) 진료 기록에 항상 함께 보여준다.
    const vitalsBits = [];
    if(v.bp) vitalsBits.push(`혈압 ${v.bp}`);
    if(v.glucose) vitalsBits.push(`공복혈당 ${v.glucose}`);
    if(v.weight) vitalsBits.push(`체중 ${v.weight}kg`);
    if(v.temp) vitalsBits.push(`체온 ${v.temp}℃`);
    const vitalsLine = vitalsBits.length ? `<div style="font-size:13.5px; color:var(--teal-dark); font-weight:600; margin:2px 0 6px;">${vitalsBits.join(' · ')}</div>` : '';
    if(Array.isArray(v.deptEntries) && v.deptEntries.length){
      const blocks = v.deptEntries.map(deptEntryBlockHTML).join('<hr style="border:none; border-top:1px dashed var(--line); margin:10px 0;">');
      return `<div class="timeline-entry" id="timeline-${v.id}"><div class="tdate">${fmtDate(v.date)}</div>${vitalsLine}${blocks}${attach}</div>`;
    }
    // 이번 업데이트 이전 방식으로 저장된 옛 기록과의 호환 표시
    return `<div class="timeline-entry" id="timeline-${v.id}">
      <div class="tdate">${fmtDate(v.date)}</div>
      ${vitalsLine}
      ${v.progressNote ? `<p style="white-space:pre-wrap; margin:6px 0;">${v.progressNote}</p>` : '<p style="color:var(--ink-soft); margin:6px 0;">(작성된 소견 없음)</p>'}
      ${v.prescriptionItems && v.prescriptionItems.length ? `<div style="margin-top:6px;"><b>약처방</b>${rxItemsToTableHTML(v.prescriptionItems)}</div>` : (v.prescription?`<p style="white-space:pre-wrap;">${v.prescription}</p>`:'')}
      ${attach}
    </div>`;
  }).join('');
  return `<div style="max-height:520px; overflow-y:auto; padding-right:4px;">${body}</div>`;
}

// 진료 기록 안에서 한 진료과의 기록 한 블록 (소견 → 진단명 → 검사결과 → 약처방(표) → 향후계획 → 서명 순서)
function deptEntryBlockHTML(e){
  const noteText = e.note && e.note.trim() ? e.note.trim() : '(작성된 소견 없음)';
  const dxHTML = (e.diagnoses && e.diagnoses.length)
    ? `<div style="margin-top:6px; font-size:14.5px;"><b>진단명:</b> ${e.diagnoses.map(d=>`${d.ko}${d.en?`(${d.en})`:''} · ${d.code}`).join(', ')}</div>` : '';
  const examHTML = (e.examItems && e.examItems.length)
    ? `<div style="margin-top:6px; font-size:14.5px;"><b>검사결과:</b> ${e.examItems.map(it=>`${it.name}${it.result?(': '+it.result):' (결과 미기재)'}`).join(', ')}</div>` : '';
  const rxHTML = (e.rxItems && e.rxItems.length)
    ? `<div style="margin-top:6px;"><b style="font-size:14.5px;">약처방</b>${rxItemsToTableHTML(e.rxItems)}</div>` : '';
  const planHTML = (e.plan && e.plan.trim()) ? `<div style="margin-top:6px; font-size:14.5px;"><b>향후계획:</b> ${e.plan.trim()}</div>` : '';
  const sig = `<div style="margin-top:6px; font-size:14px; color:var(--ink-soft);">&lt;${e.deptName} ${e.doctorName}&gt; ${e.completedAt ? formatSignatureTimestamp(new Date(e.completedAt)) : ''}</div>`;
  return `<div><div style="font-weight:700; font-size:16px; margin-bottom:4px;">[${e.deptName}]</div><p style="white-space:pre-wrap; margin:4px 0;">${noteText}</p>${dxHTML}${examHTML}${rxHTML}${planHTML}${sig}</div>`;
}

async function savePatientInfo(){
  const name = document.getElementById('p-name').value.trim();
  const regNo = document.getElementById('p-regno').value.trim();
  const gender = document.getElementById('p-gender').value;

  const phone = document.getElementById('p-phone').value;
  if(!name || !regNo){ alert('이름과 등록번호는 비워둘 수 없습니다.'); return; }
  try{
    await db.collection('patients').doc(activePatientId).update({name, regNo, gender, age, phone});

    // 대기 리스트에 같은 환자가 대기 중이면 표시 정보도 함께 갱신
    const waitingSnap = await db.collection('waitingList')
      .where('patientId','==', activePatientId).where('status','==','waiting').get();
    const batchUpdates = waitingSnap.docs.map(d => d.ref.update({name, regNo, gender, age}));
    await Promise.all(batchUpdates);

    // 작성 중이던 진료 기록이 사라지지 않도록 전체 화면을 다시 그리지 않고 해당 부분만 갱신
    if(activePatientData){ Object.assign(activePatientData, {name, regNo, gender, age, phone}); }
    const pinfoView = document.getElementById('pinfo-view');
    if(pinfoView) pinfoView.innerHTML = `${name} <span class="mono" style="font-size:14px; color:var(--ink-soft); font-weight:400;">${regNo}</span><span class="hist-edit-toggle" style="font-size:13px; margin-left:8px;" onclick="togglePatientInfoEdit()">정보수정</span>`;
    const metaRow = document.getElementById('chart-meta-row');
    if(metaRow) metaRow.textContent = `${gender||''} · ${ageLabel(age)} · ${activePatientData?.siteName||''}`;
    togglePatientInfoEdit();
    alert('환자 정보가 저장되었습니다.');
  }catch(err){
    alert('저장 실패: ' + err.message);
  }
}

// 지금 차트 화면에 입력된 값들(활력징후/소견/처방/진단명)을 draftNote 형태로 모아준다.
// DOM이 사라지기 전에 반드시 동기적으로(await 이전에) 호출해서 값을 캡처해야 한다.
function collectCurrentDraftNote(){
  return {
    bp: document.getElementById('v-bp')?.value || '',
    weight: document.getElementById('v-weight')?.value || '',
    glucose: document.getElementById('v-glucose')?.value || '',
    temp: document.getElementById('v-temp')?.value || '',
    note: document.getElementById('v-note')?.value || '',
    plan: document.getElementById('v-plan')?.value || '',
    rxMode: document.getElementById('v-rx-mode')?.value || '',
    rxItems: (typeof collectRxRows === 'function') ? collectRxRows() : [],
    diagnoses: (typeof activeDraftDiagnoses !== 'undefined') ? activeDraftDiagnoses.slice() : []
  };
}
function draftNoteHasContent(d){
  return !!(d && (d.bp || d.weight || d.glucose || d.temp || d.note || d.plan || (d.rxItems && d.rxItems.length) || (d.diagnoses && d.diagnoses.length)));
}

// 진료 중(진료완료를 누르기 전) 대기리스트/약국 등 다른 메뉴로 이동하거나, 뒤로가기·다른 환자
// 차트 열기 등으로 화면을 벗어나도 작성 중이던 내용을 잃지 않도록 접수 세션(waitingList)의
// draftNote로 자동 임시 저장해둔다. setScreen(), openChart(), popstate 핸들러 각각에서
// 화면이 실제로 바뀌기 전에 호출한다. draftNote 값은 이 함수가 호출되는 시점(=아직 이전 화면의
// DOM이 살아있는 시점)에 동기적으로 캡처하므로 안전하다.
async function autoSaveChartDraftIfLeaving(){
  if(screenName !== 'chart') return;
  if(!activePatientId) return;
  const draftNote = collectCurrentDraftNote(); // DOM이 사라지기 전에 즉시 캡처
  if(!draftNoteHasContent(draftNote)) return;
  if(!activeWaitingId || activeDeptIndex===null || activeDeptIndex===undefined){
    const ok = await ensureWaitingSessionForActiveChart();
    if(!ok) return;
  }
  const waitingId = activeWaitingId;
  const deptIndex = activeDeptIndex;
  try{
    const wRef = db.collection('waitingList').doc(waitingId);
    const wDoc = await wRef.get();
    if(!wDoc.exists) return;
    const wdata = wDoc.data();
    const depts = (wdata.departments||[]).slice();
    const dept = depts[deptIndex];
    if(!dept || dept.status === 'done') return; // 이미 완료되어 약국 등으로 넘어간 과는 건드리지 않음
    depts[deptIndex] = {...dept, draftNote};
    await wRef.update({departments: depts});
  }catch(err){ console.error('진료 중 임시 저장 실패', err); }
}

function hasClinicalContent(){
  const bp = document.getElementById('v-bp')?.value.trim();

  const temp = document.getElementById('v-temp')?.value.trim();
  const note = document.getElementById('v-note')?.value.trim();
  const plan = document.getElementById('v-plan')?.value.trim();
  const pdf = document.getElementById('v-pdf')?.files.length;
  const rxItems = collectRxRows();
  return !!(bp || weight || glucose || temp || note || plan || pdf || rxItems.length>0 || (activeDraftDiagnoses && activeDraftDiagnoses.length>0));
}

// "2026. 07. 15. 11:58 AM" 형식의 서명용 타임스탬프
function formatSignatureTimestamp(d){
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  let h = d.getHours();
  const ampm = h>=12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h = 12;
  const hh = String(h).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${yyyy}. ${mm}. ${dd}. ${hh}:${mi} ${ampm}`;
}

// 한 진료과가 완료 처리를 누른 시점에 Progress Note(텍스트)에 이어붙일 블록.
// 처방/검사결과/진단명은 여기 텍스트에 녹이지 않고 deptEntry의 구조화된 필드로 따로 저장해서,
// 진료 기록 화면에서 검사결과·약처방(표)·진단명을 각각 보기 좋게 구분해서 보여준다.
function buildDeptEntryText({deptName, doctorName, note, when}){
  const label = deptName || '일반진료';
  const lines = [`[${label}]`];
  lines.push(note && note.trim() ? note.trim() : '(작성된 소견 없음)');
  lines.push(`<${label} ${doctorName}> ${formatSignatureTimestamp(when)}`);
  return lines.join('\n');
}

async function saveVisit(silent, preloadedWaitingSnapshot){
  try{
    const photoFile = document.getElementById('v-photo').files[0];

    // 진료 내용 없이 사진만 첨부한 경우: 진료기록을 만들지 않고 환자 사진만 갱신
    if(!hasClinicalContent()){
      if(photoFile){
        const path = `patients/${activePatientId}/${Date.now()}_${photoFile.name}`;
        const ref = storage.ref().child(path);
        await ref.put(photoFile);
        const photoURL = await ref.getDownloadURL();
        await db.collection('patients').doc(activePatientId).update({photoURL});
        if(!silent) alert('사진이 환자 정보에 저장되었습니다. (진료 기록으로는 남지 않습니다)');
      }
      return;
    }

    const bp = document.getElementById('v-bp').value;
    const weight = document.getElementById('v-weight').value;
    const glucose = document.getElementById('v-glucose').value;
    const temp = document.getElementById('v-temp').value;
    const noteInput = document.getElementById('v-note').value;
    const prescriptionItems = collectRxRows();
    const prescription = rxItemsToText(prescriptionItems);
    const plan = document.getElementById('v-plan').value;
    const rxMode = document.getElementById('v-rx-mode').value;
    const pdfFile = document.getElementById('v-pdf').files[0];

    // 접수 없이(검색으로) 열린 차트에서 지금 처음으로 실제 저장할 내용이 생긴 경우, 지금 대기
    // 리스트에 접수 항목을 만든다. 이래야 이후 완료 처리·다른 화면 이동 후 재조회가 정상 작동한다.
    if(!activeWaitingId) await ensureWaitingSessionForActiveChart();

    let photoURL = null, pdfURL = null;
    // 사진과 PDF는 서로 무관한 업로드라 동시에 진행한다 (순서대로 하나씩 기다리지 않음).
    const uploadTasks = [];
    if(photoFile){
      uploadTasks.push((async()=>{
        const path = `patients/${activePatientId}/${Date.now()}_${photoFile.name}`;
        const ref = storage.ref().child(path);
        await ref.put(photoFile);
        photoURL = await ref.getDownloadURL();
        await db.collection('patients').doc(activePatientId).update({photoURL});
      })());
    }
    if(pdfFile){
      uploadTasks.push((async()=>{
        const path = `patients/${activePatientId}/${Date.now()}_${pdfFile.name}`;
        const ref = storage.ref().child(path);
        await ref.put(pdfFile);
        pdfURL = await ref.getDownloadURL();
      })());
    }
    if(uploadTasks.length) await Promise.all(uploadTasks);

    const now = new Date();
    const deptLabel = activeDeptName || currentUser.dept || '일반진료';
    const examItems = activeExamOrder ? (activeExamOrder.items||[]) : [];
    const ownNewRxItems = collectNewRxRows(); // 다른 과가 이미 넣어둔 처방은 제외, 이 과가 새로 추가한 것만
    const diagnoses = (activeDraftDiagnoses||[]).slice();
    const entryText = buildDeptEntryText({deptName: deptLabel, doctorName: currentUser.name, note: noteInput, when: now});
    const deptEntry = {
      deptName: deptLabel, doctorName: currentUser.name,
      note: noteInput, rxItems: ownNewRxItems, examItems, diagnoses, plan,
      completedAt: now.toISOString()
    };

    // 같은 접수 세션(waitingId) 안에서 다른 진료과가 먼저 저장했는지 확인 -> 있으면 그 문서에 이어쓰기,
    // 없으면(이 세션의 첫 저장, 또는 접수 세션 없이 차트만 여는 경우) 새 방문 문서를 만든다.
    // completeVisit()이 이미 이 문서를 한 번 읽어서 넘겨준 경우(preloadedWaitingSnapshot)에는 그걸
    // 그대로 재사용해서, 같은 문서를 두 번 왕복해서 읽는 낭비를 없앤다.
    let existingVisitId = null;
    let wRefForSession = null;
    let preloadedWaitingData = null;
    if(activeWaitingId){
      wRefForSession = db.collection('waitingList').doc(activeWaitingId);
      const wSnap = preloadedWaitingSnapshot || await wRefForSession.get();
      if(wSnap && wSnap.exists){
        preloadedWaitingData = wSnap.data();
        existingVisitId = preloadedWaitingData.visitId || null;
      }
    }

    let savedVisitId = existingVisitId;
    if(existingVisitId){
      const visitRef = db.collection('patients').doc(activePatientId).collection('visits').doc(existingVisitId);
      const prevSnap = await visitRef.get();
      const prev = prevSnap.exists ? prevSnap.data() : {};
      const combinedNote = (prev.progressNote ? prev.progressNote + '\n\n' : '') + entryText;
      const combinedEntries = Array.isArray(prev.deptEntries) ? prev.deptEntries.concat([deptEntry]) : [deptEntry];
      await visitRef.update({
        progressNote: combinedNote,
        deptEntries: combinedEntries,
        bp: bp || prev.bp || '',
        weight: weight || prev.weight || '',
        glucose: glucose || prev.glucose || '',
        temp: temp || prev.temp || '',
        prescription, prescriptionItems,
        plan: plan || prev.plan || '',
        photoURL: photoURL || prev.photoURL || null,
        pdfURL: pdfURL || prev.pdfURL || null,
        dispenseMode: rxMode,
        lastUpdatedBy: { name: currentUser.name, dept: deptLabel }
      });
    } else {
      const newVisitRef = await db.collection('patients').doc(activePatientId).collection('visits').add({
        date: firebase.firestore.FieldValue.serverTimestamp(),
        bp, weight, glucose, temp,
        progressNote: entryText,
        deptEntries: [deptEntry],
        prescription, prescriptionItems, plan, photoURL, pdfURL,
        dispenseMode: rxMode,
        createdBy: { name: currentUser.name, dept: deptLabel }
      });
      savedVisitId = newVisitRef.id;
      if(wRefForSession){
        await wRefForSession.update({ visitId: newVisitRef.id }).catch(()=>{});
      }
    }

    // 아래 두 작업은 서로 다른 문서에 쓰는 독립적인 작업이라 동시에 진행한다.
    const tailTasks = [];
    // 이 환자의 "평생 첫 실제 진료"를 환자 문서에 캐시해둔다. 한 번 정해지면 다시 바뀌지 않으며,
    // 이후 통계 화면에서 신환/재진을 판정할 때 이 값만 보면 되므로 환자 수만큼 개별 조회를 보낼 필요가 없어진다.
    // (지금 이 저장이 성공했다는 것은 곧 이 환자에게 "실제 진료 내용"이 방금 처음 생겼거나 이미 있었다는 뜻이므로,
    //  아직 firstVisitId가 없는 경우 지금 이 방문이 시간 순서상 첫 실제 진료가 맞다.)
    if(activePatientData && !activePatientData.firstVisitId && !activePatientData.imported && !activePatientData.testPatient){
      tailTasks.push(
        db.collection('patients').doc(activePatientId).update({firstVisitId: savedVisitId})
          .then(()=>{ activePatientData.firstVisitId = savedVisitId; })
          .catch(err=>console.error('firstVisitId 캐시 저장 실패', err))
      );
    }

    let wroteSessionRx = false;
    if(activeWaitingId){
      // 여러 진료과가 이어서 진료하는 경우: 처방을 바로 약국에 보내지 않고 접수 세션에 누적 저장.
      // 실제 약국 전송은 completeVisit()에서 "마지막 진료과"가 완료될 때 처리됨.
      tailTasks.push(
        db.collection('waitingList').doc(activeWaitingId).update({
          sessionRx: prescriptionItems,
          lastRxMode: rxMode
        }).catch(()=>{})
      );
      wroteSessionRx = true;
    } else if(rxMode === 'pharmacy' && prescription.trim() && activePatientData){
      tailTasks.push(
        db.collection('pharmacyQueue').add({
          patientId: activePatientId,
          patientName: activePatientData.name,
          regNo: activePatientData.regNo,
          siteName: activePatientData.siteName,
          testPatient: !!activePatientData.testPatient,
          prescription, prescriptionItems,
          status: 'waiting',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
      );
    }
    if(tailTasks.length) await Promise.all(tailTasks);

    if(!silent){
      alert('진료 기록이 저장되었습니다.' + (rxMode==='pharmacy' ? ' (진료 완료 처리 시 약국으로 전송됩니다)' : ''));
      openChart(activePatientId, activeWaitingId, activeDeptIndex);
    }

    // completeVisit()이 waitingList 문서를 또 한 번 읽지 않고도 최신 sessionRx/lastRxMode를 알 수 있도록 반환.
    // (이번 호출에서 새로 썼으면 그 값을, 안 썼으면 사전 조회해둔 기존 값을 그대로 돌려준다)
    return {
      sessionRx: wroteSessionRx ? prescriptionItems : (preloadedWaitingData ? preloadedWaitingData.sessionRx : undefined),
      lastRxMode: wroteSessionRx ? rxMode : (preloadedWaitingData ? preloadedWaitingData.lastRxMode : undefined)
    };
  }catch(err){
    alert('저장 실패: ' + err.message + '\n\n이 메시지를 캡처해서 보내주세요.');
    throw err;
  }
}

// "과거력 저장" 버튼을 따로 안 눌러도, 진료 완료 처리 시 편집 중이던 과거력을 자동으로 저장.
async function saveHistorySilently(){
  const editEl = document.getElementById('hist-edit');
  if(!editEl || editEl.style.display === 'none') return; // 지금 과거력을 편집 중이 아니면 아무것도 하지 않음
  const history = {
    hypertension: document.getElementById('e-h-htn').checked,
    diabetes: document.getElementById('e-h-dm').checked,
    tb: document.getElementById('e-h-tb').checked,
    hepatitis: document.getElementById('e-h-hep').checked,
    hiv: document.getElementById('e-h-hiv').checked,
    drugAllergy: document.getElementById('e-h-allergy').checked,
    surgery: document.getElementById('e-h-surgery').checked
  };
  const historyNote = document.getElementById('e-h-note').value;
  try{
    await db.collection('patients').doc(activePatientId).update({history, historyNote});

  }catch(err){ console.error('과거력 자동저장 실패', err); }
}

let isCompletingVisit = false;
async function completeVisit(){
  if(isCompletingVisit) return; // 중복 클릭으로 인한 진료 기록 중복 생성 방지
  isCompletingVisit = true;
  // 버튼을 누른 즉시 "처리 중..."으로 바꿔서, 반응이 느려도 눌린 게 맞다는 걸 바로 알 수 있게 한다.
  // (인터넷이 느릴 때 "안 눌렸나?" 하고 여러 번 누르게 되던 문제)
  const completeBtn = document.getElementById('complete-visit-btn');
  const completeBtnOriginalText = completeBtn ? completeBtn.textContent : null;
  if(completeBtn){ completeBtn.disabled = true; completeBtn.textContent = '처리 중...'; }
  const restoreCompleteBtn = () => {
    const btn = document.getElementById('complete-visit-btn');
    if(btn){ btn.disabled = false; btn.textContent = completeBtnOriginalText || '진료 완료 처리'; }
  };
  try{
    await saveHistorySilently();

    // 대기 세션 문서를 여기서 딱 한 번만 미리 읽어서 saveVisit()에 넘겨준다. (예전에는 saveVisit()
    // 안에서 한 번, 완료 처리에서 또 한 번, 같은 문서를 두 번 왕복해서 읽고 있었다. 시골 지역처럼
    // 인터넷 왕복 시간이 긴 환경에서는 이 "왕복 1번"이 매번 그대로 지연 시간에 더해지고 있었다.)
    let preloadedWaitingSnapshot = null;
    if(activeWaitingId){
      try{ preloadedWaitingSnapshot = await db.collection('waitingList').doc(activeWaitingId).get(); }
      catch(err){ console.error('접수 세션 사전 조회 실패', err); }
    }

    let saveVisitResult = null;
    if(hasUnsavedVisitContent()){
      try{
        saveVisitResult = await saveVisit(true, preloadedWaitingSnapshot);
      }catch(err){
        restoreCompleteBtn();
        return; // 저장 실패 시 완료 처리 중단 (기록 유실 방지)
      }
    }
    if(activeWaitingId){
    try{
      const wRef = db.collection('waitingList').doc(activeWaitingId);
      // departments는 saveVisit()이 건드리지 않는 필드라 사전 조회 값을 그대로 써도 안전하다.
      // sessionRx/lastRxMode는 saveVisit()이 방금 갱신했을 수 있으니, saveVisit()이 돌려준 최신 값이
      // 있으면 그걸 우선 쓰고, 없으면(저장할 새 내용이 없던 경우) 사전 조회 값을 그대로 쓴다.
      let wSnapshotForCompletion = preloadedWaitingSnapshot;
      // 사전 조회(맨 위에서 딱 한 번 읽은 것)가 인터넷 순간 끊김 등으로 실패했거나 문서를 못 찾은 경우,
      // 여기서 조용히 넘어가면 화면은 "대기 리스트"로 넘어가서 마치 완료된 것처럼 보이지만 실제로는
      // 상태가 전혀 바뀌지 않아 환자가 "진료중" 상태로 대기 리스트에 그대로 남는 문제가 있었다.
      // (직접 "삭제" 버튼을 눌러야만 사라지던 증상의 원인) 그래서 여기서 한 번 더 확인 조회한다.
      if(!wSnapshotForCompletion || !wSnapshotForCompletion.exists){
        try{ wSnapshotForCompletion = await wRef.get(); }
        catch(err){ console.error('완료 처리 직전 재조회도 실패', err); }
      }
      const wdata = (wSnapshotForCompletion && wSnapshotForCompletion.exists) ? wSnapshotForCompletion.data() : null;
      if(!wdata){
        throw new Error('접수 정보를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤, 대기 리스트가 아니라 이 화면에서 "진료 완료 처리"를 다시 눌러주세요.');
      }
      {
        const effectiveSessionRx = (saveVisitResult && saveVisitResult.sessionRx !== undefined) ? saveVisitResult.sessionRx : wdata.sessionRx;
        const effectiveLastRxMode = (saveVisitResult && saveVisitResult.lastRxMode !== undefined) ? saveVisitResult.lastRxMode : wdata.lastRxMode;

        let isLastDept = true;
        let updatePayload = {status:'done'};
        if(wdata.departments && wdata.departments.length){
          const depts = wdata.departments.slice();
          if(activeDeptIndex !== null && depts[activeDeptIndex]){
            depts[activeDeptIndex] = {...depts[activeDeptIndex], status:'done', doctorName: currentUser.name, completedAt: new Date().toISOString(), draftNote: null};
          } else {
            // 이 접수 세션의 어느 진료과를 완료 처리해야 할지 특정하지 못한 경우다. 이 상태로 그냥
            // 넘어가면 departments 배열이 그대로 남아 상태가 "진료중"에 머무르고, 환자가 대기
            // 리스트에서 사라지지 않는다. 조용히 넘어가지 않고 바로 알려서, 대기 리스트 화면에서
            // 정식으로 진료과 버튼을 눌러 다시 열도록 안내한다.
            throw new Error('이 접수 세션에서 담당 진료과를 확인하지 못해 완료 처리를 하지 못했습니다. "대기환자 리스트" 화면으로 가서 해당 환자의 진료과 버튼을 다시 눌러 열어주세요.');
          }
          const overall = computeOverallStatus(depts);
          isLastDept = overall === 'done';
          updatePayload = {departments: depts, status: overall};
        }

        // 아래 두 작업(대기 상태 갱신, 약국 전송)은 서로 다른 문서에 쓰는 독립적인 작업이라 동시에 진행한다.
        const finishTasks = [wRef.update(updatePayload)];
        if(isLastDept && effectiveLastRxMode === 'pharmacy' && (effectiveSessionRx||[]).length && activePatientData){
          const items = effectiveSessionRx;
          const presText = rxItemsToText(items);
          if(presText.trim()){
            finishTasks.push(db.collection('pharmacyQueue').add({
              patientId: activePatientId,
              patientName: activePatientData.name,
              regNo: activePatientData.regNo,
              siteName: activePatientData.siteName,
              testPatient: !!activePatientData.testPatient,
              prescription: presText, prescriptionItems: items,
              status: 'waiting',
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }));
          }
        }
        await Promise.all(finishTasks);
      }
    }catch(err){
      console.error(err);
      alert('진료 완료 처리 중 오류가 발생했습니다: ' + err.message + '\n\n(대기 리스트로 넘어가지 않고 이 화면에 그대로 있습니다. 위 안내대로 하신 뒤 다시 시도해주세요)');
      restoreCompleteBtn();
      return; // 완료 처리가 실제로 안 됐는데도 대기 리스트로 넘어가서 "완료된 것처럼" 보이지 않도록 여기서 중단
    }
  }
  setScreen('queue');
  }finally{
    isCompletingVisit = false;
  }
}

async function deletePatient(){
  if(!activePatientData) return;
  const confirmText = prompt(`정말 삭제하시겠습니까? 이 환자의 모든 진료기록도 함께 영구 삭제됩니다.\n확인하려면 등록번호(${activePatientData.regNo})를 그대로 입력해주세요.`);
  if(confirmText !== activePatientData.regNo){
    if(confirmText !== null) alert('등록번호가 일치하지 않아 취소되었습니다.');
    return;
  }
  try{
    const visitsSnap = await db.collection('patients').doc(activePatientId).collection('visits').get();
    for(let i=0; i<visitsSnap.docs.length; i+=400){
      const batch = db.batch();
      visitsSnap.docs.slice(i,i+400).forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    const waitingSnap = await db.collection('waitingList').where('patientId','==',activePatientId).get();
    for(const d of waitingSnap.docs){ await d.ref.delete(); }

    await db.collection('patients').doc(activePatientId).delete();
    alert('환자가 삭제되었습니다. 등록번호를 다시 정확히 맞추려면 "사이트 관리"에서 해당 사이트의 "번호 동기화"를 눌러주세요.');
    setScreen('queue');
  }catch(err){
    alert('삭제 실패: ' + err.message);
  }
}

function startRenameSite(id, name, prefix){
  const el = document.getElementById(`rename-form-${id}`);
  if(el) el.style.display = el.style.display==='none' ? 'block' : 'none';
}

async function saveRenameSite(id){
  const name = document.getElementById(`rn-name-${id}`).value.trim();
  const prefix = document.getElementById(`rn-prefix-${id}`).value.trim();
  if(!name){ alert('사이트 이름을 입력해주세요.'); return; }
  try{
    await db.collection('sites').doc(id).update({name, prefix});
    alert('사이트 정보가 수정되었습니다. (이미 등록된 환자의 기존 등록번호는 바뀌지 않습니다)');
    renderMain();
  }catch(err){
    alert('수정 실패: ' + err.message);
  }
}

async function deleteSite(id, name){
  if(!confirm(`"${name}" 사이트를 삭제할까요?\n이미 등록된 환자 데이터는 지워지지 않지만, 앞으로 이 사이트로 신규 등록은 할 수 없게 됩니다.`)) return;
  try{
    await db.collection('sites').doc(id).delete();
    renderMain();
  }catch(err){
    alert('삭제 실패: ' + err.message);
  }
}

// 만성질환관리 화면: 고혈압/당뇨 환자 중, "다음 방문 예약"이 잡혀 있는 환자만 골라서 예약일자와 함께

async function loadChronicList(){
  const el = document.getElementById('chronic-list');
  if(!el) return;
  el.innerHTML = `<div class="empty-note">${t('loading')}</div>`;
  try{
    const [htnSnap, dmSnap, apptSnap] = await Promise.all([
      db.collection('patients').where('history.hypertension','==',true).get(),
      db.collection('patients').where('history.diabetes','==',true).get(),
      db.collection('appointments').get()
    ]);
    const patientsMap = {};
    htnSnap.docs.forEach(d=>{ patientsMap[d.id] = {id:d.id, ...d.data()}; });
    dmSnap.docs.forEach(d=>{ patientsMap[d.id] = {id:d.id, ...d.data()}; });

    // 환자ID -> 가장 이른(가까운) 예약. 같은 환자에게 예약이 여러 개면 그중 가장 빠른 날짜/시간을 사용.
    const apptMap = {};
    apptSnap.docs.forEach(d=>{
      const a = d.data();
      if(!a.patientId) return;
      const key = `${a.date||''} ${a.time||''}`;
      if(!apptMap[a.patientId] || key < apptMap[a.patientId].key){
        apptMap[a.patientId] = {key, date:a.date||'', time:a.time||''};
      }
    });

    const list = Object.values(patientsMap)
      .filter(p => !p.testPatient && apptMap[p.id])
      .map(p => ({...p, appt: apptMap[p.id]}))
      .sort((a,b)=> (a.appt.key||'').localeCompare(b.appt.key||''));

    if(list.length === 0){ el.innerHTML = '<div class="empty-note">다음 방문 예약이 잡혀 있는 만성질환(고혈압/당뇨) 환자가 없습니다.</div>'; return; }

    el.innerHTML = list.map(p=>{
      const tags = [];
      if(p.history?.hypertension) tags.push('고혈압');
      if(p.history?.diabetes) tags.push('당뇨');
      return `<div class="queue-card" onclick="openChartSafely('${p.id}')">
        <div class="qc-info">
          <div class="name">${p.name} <span style="font-size:12.5px; color:var(--teal-dark); font-weight:600;">${tags.join('·')}</span></div>
          <div class="meta">${p.gender||''} · ${ageLabel(p.age)} · ${p.siteName||''}</div>
        </div>
        <div style="text-align:right;">
          <div class="qc-regno mono">${p.regNo||''}</div>
          <div style="font-size:13px; color:var(--ink-soft); margin-top:2px;">📅 ${p.appt.date}${p.appt.time?(' '+p.appt.time):''}</div>
        </div>
      </div>`;
    }).join('');
  }catch(err){
    el.innerHTML = `<div class="empty-note">불러오기 실패, 아래 링크를 눌러 색인을 만들어주세요:<br>${linkify(err.message)}</div>`;
  }
}

async function submitAppointment(){
  let name = document.getElementById('a-name').value.trim();
  const regNoInput = document.getElementById('a-regno').value.trim();
  const siteId = document.getElementById('a-site').value;
  const site = sites.find(s=>s.id===siteId);
  const date = document.getElementById('a-date').value;
  const time = document.getElementById('a-time').value;
  const note = document.getElementById('a-note').value;

  // 등록번호가 입력되면 실제 환자 기록을 찾아 연동한다(이름 자동 채움, 사이트 정보 일치,
  // 나중에 그 환자의 차트에서 예약 내역이 보이도록 patientId도 함께 저장).
  let patientId = null, regNo = regNoInput || null, siteIdFinal = siteId, siteNameFinal = site?site.name:'';
  if(regNoInput){
    try{
      const patients = await getAllPatientsCached();
      const found = patients.find(p => (p.regNo||'').toLowerCase() === regNoInput.toLowerCase());
      if(found){
        patientId = found.id;
        regNo = found.regNo;
        if(!name) name = found.name;
        siteIdFinal = found.siteId;
        siteNameFinal = found.siteName;
      }
    }catch(err){ console.error('등록번호로 환자 조회 실패', err); }
  }
  if(!name){ alert('환자 이름을 입력하거나, 등록된 등록번호를 입력해주세요.'); return; }
  try{
    await db.collection('appointments').add({
      name, siteId: siteIdFinal, siteName: siteNameFinal, date, time, note,
      patientId, regNo,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    alert('예약이 등록되었습니다.' + (patientId ? ' (환자기록과 연동됨)' : ''));
    document.getElementById('cal-date').value = date;
    loadAppointments();
    document.getElementById('a-name').value = '';
    document.getElementById('a-regno').value = '';
    document.getElementById('a-note').value = '';
  }catch(err){
    alert('예약 등록 실패: ' + err.message);
  }
}

// 등록번호로 (날짜와 무관하게) 그 환자의 모든 예약을 찾는다. regNo 텍스트로 직접 저장된 예약과,
// patientId로 연동된 예약(예: 등록번호 없이 진료 중 "다음 방문 예약하기"로 만든 예약) 양쪽을 모두 찾아 합친다.
async function searchAppointmentsByRegNo(){
  const regNoRaw = document.getElementById('appt-search-regno').value.trim();
  const resultsEl = document.getElementById('appt-search-results');
  if(!regNoRaw){ resultsEl.innerHTML = ''; return; }
  resultsEl.innerHTML = `<div class="empty-note">${t('loading')}</div>`;
  try{
    const [byRegNoSnap, patients] = await Promise.all([
      db.collection('appointments').where('regNo','==', regNoRaw).get(),
      getAllPatientsCached()
    ]);
    const found = patients.find(p => (p.regNo||'').toLowerCase() === regNoRaw.toLowerCase());
    let byPatientDocs = [];
    if(found){
      const byPatientSnap = await db.collection('appointments').where('patientId','==', found.id).get();
      byPatientDocs = byPatientSnap.docs;
    }
    const merged = {};
    byRegNoSnap.docs.forEach(d=>{ merged[d.id]=d; });
    byPatientDocs.forEach(d=>{ merged[d.id]=d; });
    const docs = Object.values(merged).sort((a,b)=>{
      const av = `${a.data().date||''} ${a.data().time||''}`;
      const bv = `${b.data().date||''} ${b.data().time||''}`;
      return av.localeCompare(bv);
    });
    if(docs.length===0){ resultsEl.innerHTML = '<div class="empty-note">해당 등록번호의 예약이 없습니다.</div>'; return; }
    resultsEl.innerHTML = docs.map(d=>{
      const a = d.data();
      return `<div class="appt-item"><span class="appt-time">${a.date||''} ${a.time||''}</span>${a.name||''} · ${a.siteName||''}${a.note?' · '+a.note:''}</div>`;
    }).join('');
  }catch(err){
    resultsEl.innerHTML = `<div class="empty-note">불러오기 실패, 아래 링크를 눌러 색인을 만들어주세요:<br>${linkify(err.message)}</div>`;
  }
}

let labDoneDate = null;
function renderLabDoneList(){
  if(unsubscribeQueue){ unsubscribeQueue(); unsubscribeQueue=null; }
  const main = document.getElementById('main');
  if(!labDoneDate) labDoneDate = new Date().toISOString().slice(0,10);
  main.innerHTML = `
    <div class="topbar"><h2>검사 완료 환자 리스트</h2><button class="btn small outline" style="width:auto;" onclick="renderLab()">← 검사 대기 리스트</button></div>
    <div class="card">
      <div class="field" style="max-width:220px; margin-bottom:0;"><label>완료 날짜</label><input type="date" id="lab-done-date" value="${labDoneDate}" onchange="onLabDoneDateChange()"></div>
    </div>
    <div id="lab-done-list" class="queue" style="margin-top:14px;"><div class="empty-note">${t('loading')}</div></div>
  `;
  loadLabDoneList();
}
function onLabDoneDateChange(){
  labDoneDate = document.getElementById('lab-done-date').value;
  loadLabDoneList();
}
async function loadLabDoneList(){
  const list = document.getElementById('lab-done-list');
  if(!list) return;
  list.innerHTML = `<div class="empty-note">${t('loading')}</div>`;
  try{
    const startTs = firebase.firestore.Timestamp.fromDate(new Date(labDoneDate+'T00:00:00'));
    const endTs = firebase.firestore.Timestamp.fromDate(new Date(labDoneDate+'T23:59:59'));
    const snap = await db.collection('labQueue').where('status','==','done')
      .where('completedAt','>=',startTs).where('completedAt','<=',endTs)
      .orderBy('completedAt','desc').get();
    if(snap.empty){ list.innerHTML = '<div class="empty-note">해당 날짜에 완료된 검사가 없습니다.</div>'; return; }
    list.innerHTML = snap.docs.map(d=>{
      const l = d.data();
      const itemNames = (l.items||[]).map(i=>i.name).join(', ');
      return `<div class="queue-card" onclick="openLabOrder('${d.id}')">
        <div class="qc-info">
          <div class="name">${l.patientName}${testBadgeHTML(l.testPatient)} <span class="pharm-status">${l.deptName}</span></div>
          <div class="meta">${l.regNo} · ${l.siteName} · ${itemNames}</div>
        </div>
      </div>`;
    }).join('');
  }catch(err){
    list.innerHTML = `<div class="empty-note">목록을 불러오지 못했습니다. Firestore 색인(index) 생성이 필요할 수 있습니다. 아래 링크를 눌러 색인을 만들어주세요.<br>${linkify(err.message)}</div>`;
  }
}

function openLabOrder(id){
  db.collection('labQueue').doc(id).get().then(doc=>{
    if(!doc.exists) return;
    const l = doc.data();
    const editable = canEditArea('lab');
    const isDone = l.status === 'done';
    openSidePanel(`
      <div class="history-panel-head">
        <span>${l.patientName} (${l.regNo}) · ${l.deptName} 검사</span>
        <span style="cursor:pointer;" onclick="closeSidePanel()">✕ 닫기</span>
      </div>
      <div class="history-panel-body">
        ${!editable ? '<div class="note" style="margin-bottom:10px;">보기 전용입니다 (검사실 역할만 결과 입력·완료 처리가 가능합니다).</div>' : ''}
        ${isDone ? `<div class="note" style="margin-bottom:10px;">✅ 완료 처리자: ${l.completedBy||'-'} · 완료일시: ${fmtDate(l.completedAt)}${editable ? ' (결과는 아래에서 계속 수정할 수 있습니다)' : ''}</div>` : ''}
        <div id="lab-order-items">${labOrderItemsHTML(id, l.items||[], editable)}</div>
        ${(editable && !isDone) ? `<button class="btn small" style="margin-top:14px;" onclick="completeLabOrder('${id}')">✅ 검사 완료</button>` : ''}
      </div>
    `);
  });
}
function labOrderItemsHTML(orderId, items, editable){
  return items.map((it,i)=>`
    <div class="field">
      <label>${it.name}</label>
      <textarea rows="2" placeholder="결과 입력" ${editable?'':'disabled'} onchange="updateLabResult('${orderId}',${i},this.value)">${it.result||''}</textarea>
    </div>
  `).join('');
}
async function updateLabResult(orderId, idx, value){
  try{
    const doc = await db.collection('labQueue').doc(orderId).get();
    if(!doc.exists) return;
    const items = (doc.data().items||[]).slice();
    if(!items[idx]) return;
    items[idx] = {...items[idx], result:value};
    await doc.ref.update({items});
  }catch(err){ alert('결과 저장 실패: ' + err.message); }
}
async function completeLabOrder(orderId){
  const who = getOrPromptStaffName('emr_lab_staff_name', '검사 완료 처리자');
  if(!who) return;
  try{
    const doc = await db.collection('labQueue').doc(orderId).get();
    if(!doc.exists) return;
    const l = doc.data();
    await doc.ref.update({status:'done', completedBy: who, completedAt: firebase.firestore.FieldValue.serverTimestamp()});
    if(l.waitingId && l.deptIndex !== undefined && l.deptIndex !== null){
      const wRef = db.collection('waitingList').doc(l.waitingId);
      const wDoc = await wRef.get();
      if(wDoc.exists){
        const wdata = wDoc.data();
        const depts = (wdata.departments||[]).slice();
        if(depts[l.deptIndex]){
          depts[l.deptIndex] = {...depts[l.deptIndex], status:'examDone'};
          const overall = computeOverallStatus(depts);
          await wRef.update({departments: depts, status: overall});
        }
      }
    }
    closeSidePanel();
    alert('검사 완료 처리되었습니다. 대기 리스트에 "검사완료 대기중"으로 표시됩니다.');
  }catch(err){
    alert('처리 실패: ' + err.message);
  }
}

function renderPharmacy(){
  if(unsubscribeQueue){ unsubscribeQueue(); unsubscribeQueue=null; }
  const main = document.getElementById('main');
  main.innerHTML = `<div class="topbar"><h2>약국</h2><button class="btn small outline" style="width:auto;" onclick="changeSavedStaffName('emr_pharmacist_name','처리자(약사)', renderPharmacy)">👤 담당자 변경${getSavedStaffName('emr_pharmacist_name')?(' ('+getSavedStaffName('emr_pharmacist_name')+')'):''}</button></div>${pharmTabBarHTML()}<div id="pharm-list" class="queue"><div class="empty-note">${t('loading')}</div></div>`;

  if(pharmTab === 'all'){
    getTodayVisitedPatients().then(list=>{
      const el = document.getElementById('pharm-list');
      if(!el) return;
      if(list.length === 0){ el.innerHTML = '<div class="empty-note">오늘 진료받은 환자가 없습니다.</div>'; return; }
      el.innerHTML = list.map(v=>`<div class="queue-card" onclick="openChartSafely('${v.patientId}')">
        <div class="qc-info">
          <div class="name">${v.name}</div>
          <div class="meta">${v.gender||''} · ${ageLabel(v.age)} · ${v.siteName}</div>
        </div>
        <div class="qc-regno mono">${v.regNo}</div>
      </div>`).join('');
    }).catch(err=>{
      const el = document.getElementById('pharm-list');
      if(el) el.innerHTML = `<div class="empty-note">목록을 불러오지 못했습니다. 아래 링크를 눌러 색인을 만들어주세요:<br>${linkify(err.message)}</div>`;
    });
    return;
  }

  if(pharmTab === 'direct'){
    const {startTs, endTs} = getTodayRange();
    db.collectionGroup('visits')
      .where('date','>=',startTs).where('date','<=',endTs)
      .get().then(async snap=>{
        const list = document.getElementById('pharm-list');
        if(!list) return;
        const directDocs = snap.docs.filter(v=>{
          const d = v.data();
          return d.dispenseMode === 'direct' && isRealVisitDoc(d) && (d.prescription||'').trim();
        });
        if(directDocs.length === 0){ list.innerHTML = '<div class="empty-note">오늘 진료실에서 바로 투약 완료된 처방이 없습니다.</div>'; return; }
        const uniquePatientIds = [...new Set(directDocs.map(v=>v.ref.parent.parent.id))];
        const patientDocs = await Promise.all(uniquePatientIds.map(pid=>db.collection('patients').doc(pid).get()));
        const patientMap = {};
        patientDocs.forEach(d=>{ if(d.exists) patientMap[d.id] = d.data(); });
        const sorted = directDocs.slice().sort((a,b)=>{
          const ta = a.data().date && a.data().date.toMillis ? a.data().date.toMillis() : 0;
          const tb = b.data().date && b.data().date.toMillis ? b.data().date.toMillis() : 0;
          return tb - ta;
        });
        list.innerHTML = sorted.map(v=>{
          const pid = v.ref.parent.parent.id;
          const p = patientMap[pid] || {};
          return `<div class="queue-card" style="flex-wrap:wrap; cursor:pointer;" onclick="togglePharmRx('direct-${v.id}')">
            <div class="qc-info">
              <div class="name">${p.name||'(알 수 없음)'}${testBadgeHTML(p.testPatient)} <span class="pharm-status">진료실 투약 완료</span></div>
              <div class="meta">${p.regNo||'-'} · ${p.siteName||'-'} · <span style="text-decoration:underline;">처방 보기</span></div>
            </div>
            <div id="pharm-rx-direct-${v.id}" style="display:none; width:100%; font-size:14.5px; color:var(--ink-soft); margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">${pharmRxDisplayHTML(v.data().prescriptionItems, v.data().prescription)}</div>
          </div>`;
        }).join('');
      }).catch(err=>{
        const list = document.getElementById('pharm-list');
        if(list) list.innerHTML = `<div class="empty-note">목록을 불러오지 못했습니다. 아래 링크를 눌러 색인을 만들어주세요:<br>${linkify(err.message)}</div>`;
      });
    return;
  }

  if(pharmTab === 'dispensed'){
    const {startTs, endTs} = getTodayRange();
    db.collection('pharmacyQueue')
      .where('status','==','dispensed')
      .where('dispensedAt','>=',startTs).where('dispensedAt','<=',endTs)
      .orderBy('dispensedAt','desc')
      .get().then(snap=>{
        const list = document.getElementById('pharm-list');
        if(!list) return;
        if(snap.empty){ list.innerHTML = '<div class="empty-note">오늘 완료된 투약이 없습니다.</div>'; return; }
        list.innerHTML = snap.docs.map(d=>{
          const p = d.data();
          return `<div class="queue-card" style="flex-wrap:wrap; cursor:pointer;" onclick="togglePharmRx('${d.id}')">
            <div class="qc-info">
              <div class="name">${p.patientName}${testBadgeHTML(p.testPatient)} <span class="pharm-status">완료</span></div>
              <div class="meta">${p.regNo} · ${p.siteName} · ${p.dispensedBy?('투약: '+p.dispensedBy):''} · <span style="text-decoration:underline;">처방 보기</span></div>
            </div>
            <div id="pharm-rx-${d.id}" style="display:none; width:100%; font-size:14.5px; color:var(--ink-soft); margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">${pharmRxDisplayHTML(p.prescriptionItems, p.prescription)}</div>
          </div>`;
        }).join('');
      }).catch(err=>{
        const list = document.getElementById('pharm-list');
        if(list) list.innerHTML = `<div class="empty-note">목록을 불러오지 못했습니다. 아래 링크를 눌러 색인을 만들어주세요:<br>${linkify(err.message)}</div>`;
      });
    return;
  }

  // 조제 대기(waiting) / 투약 대기(prepared)
  unsubscribeQueue = db.collection('pharmacyQueue')
    .where('status','==',pharmTab)
    .orderBy('createdAt','asc')
    .onSnapshot(snap=>{
      const list = document.getElementById('pharm-list');
      if(!list) return;
      if(snap.empty){ list.innerHTML = `<div class="empty-note">${pharmTab==='waiting'?'조제 대기중인':'투약 대기중인'} 처방이 없습니다.</div>`; return; }
      list.innerHTML = snap.docs.map(d=>{
        const p = d.data();
        const statusLabel = p.status==='waiting' ? '조제대기' : '투약대기';
        const nextLabel = p.status==='waiting' ? '조제완료 처리' : '투약/복약지도 완료';
        return `<div class="queue-card" style="flex-wrap:wrap; cursor:pointer;" onclick="togglePharmRx('${d.id}')">
          <div class="qc-info">
            <div class="name">${p.patientName}${testBadgeHTML(p.testPatient)} <span class="pharm-status">${statusLabel}</span></div>
            <div class="meta">${p.regNo} · ${p.siteName} · <span style="text-decoration:underline;">처방 보기</span></div>
          </div>
          ${canEditArea('pharmacy') ? `<button class="btn small" onclick="event.stopPropagation(); advancePharmacy('${d.id}','${p.status}')">${nextLabel}</button>` : ''}
          <div id="pharm-rx-${d.id}" style="display:none; width:100%; font-size:14.5px; color:var(--ink-soft); margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">${pharmRxDisplayHTML(p.prescriptionItems, p.prescription)}</div>
        </div>`;
      }).join('');
    }, err=>{
      const list = document.getElementById('pharm-list');
      if(list) list.innerHTML = `<div class="empty-note">목록을 불러오지 못했습니다. 아래 링크를 눌러 색인을 만들어주세요:<br>${linkify(err.message)}</div>`;
    });
}

function pharmRxDisplayHTML(items, text){
  if(items && items.length) return rxItemsToTableHTML(items, true);
  return `<p style="white-space:pre-wrap; margin:0;">${text || '(처방 내용 없음)'}</p>`;

function togglePharmRx(id){
  const el = document.getElementById(`pharm-rx-${id}`);
  if(el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function advancePharmacy(id, currentStatus){
  const who = getOrPromptStaffName('emr_pharmacist_name', '처리자(약사)');
  if(!who) return;
  const next = currentStatus === 'waiting' ? 'prepared' : 'dispensed';
  const logField = next === 'prepared' ? 'preparedBy' : 'dispensedBy';
  const timeField = next === 'prepared' ? 'preparedAt' : 'dispensedAt';
  try{
    await db.collection('pharmacyQueue').doc(id).update({
      status: next,
      [logField]: who,
      [timeField]: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(err){
    alert('처리 실패: ' + err.message);
  }
}
